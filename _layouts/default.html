<!DOCTYPE html>
<html dir="ltr" lang="{{page.lang}}" class="gov-components-loading">
  {% include head.html %}
  <body class="gov-story-theme-scope">
    <div class="gov-page-loader" role="status" aria-label="Načítání stránky">
      <div class="gov-page-loader__content" aria-hidden="true">
        <div class="gov-page-loader__line gov-page-loader__line--short"></div>
        <div class="gov-page-loader__line"></div>
        <div class="gov-page-loader__line gov-page-loader__line--long"></div>
      </div>
    </div>
    {% include header.html %}
        {{ content }}
    {% include footer.{{page.lang}}.html %}
    <script src="https://cdn.jsdelivr.net/npm/anchor-js@4.3.1/anchor.min.js"></script>
    <script>
      anchors.add('h2'){% for anchor in page.customanchors %}.add('{{ anchor }}'){% endfor %};
    </script>
  </body>
</html>
