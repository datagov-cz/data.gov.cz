<style>
  p {
  margin-top: 1em;
  margin-bottom: 1em;
}

/* Třída pro skrytí neaktivních karet (využívá se při filtrování přes JS) */
.gov-card-item.is-hidden {
  display: none !important;
}

/* --- Čistě CSS řešení pomocí selektoru :has() --- */

/* 1. Pokud je zaškrtnut alespoň jeden filtr, výchozí stav je skrytí všech karet */
#main:has(.js-filter-checkbox[checked]),
#main:has(.js-filter-checkbox:checked),
#main:has(.js-filter-checkbox input:checked) {
  .gov-card-item {
    display: none;
  }
}

/* 2. Zobrazení položek pro filtr A (použit selektor ~= pro více hodnot v data-category) */
#main:has(#filter-a[checked]),
#main:has(#filter-a:checked),
#main:has(#filter-a input:checked) {
  .gov-card-item[data-category~="hodnota-a"] {
    display: block;
  }
}

/* 3. Zobrazení položek pro filtr B */
#main:has(#filter-b[checked]),
#main:has(#filter-b:checked),
#main:has(#filter-b input:checked) {
  .gov-card-item[data-category~="hodnota-b"] {
    display: block;
  }
}    

/* 4. OPRAVENO: Zobrazení položek pro filtr C (změněno id na #filter-c) */
#main:has(#filter-c[checked]),
#main:has(#filter-c:checked),
#main:has(#filter-c input:checked) {
  .gov-card-item[data-category~="hodnota-c"] {
    display: block;
  }
} 

/* 5. OPRAVENO: Zobrazení položek pro filtr D (změněno id na #filter-d) */
#main:has(#filter-d[checked]),
#main:has(#filter-d:checked),
#main:has(#filter-d input:checked) {
  .gov-card-item[data-category~="hodnota-d"] {
    display: block;
  }
} 

/* Odsazení mezi skupinami filtrů */
.gov-filter-group + .gov-filter-group {
  margin-top: 1.5rem;
}
</style>


<gov-container id="main">
  <gov-layout type="aside" variant="left">
    <!-- Postranní panel s filtry -->
    <gov-layout-column>
      <aside aria-label="Filtr aktualit">
        <form class="gov-filters">
          
          <!-- Skupina 1: Filtr 1 -->
          <fieldset class="gov-filter-group">
            <legend class="gov-filters__heading">Filtr 1</legend>
            <ul class="gov-list--plain">
              <li>
                <!-- OPRAVENO: Přidáno id="filter-a" -->
                <gov-form-checkbox id="filter-a" size="m" value="hodnota-a" name="filter1" class="js-filter-checkbox">
                  <gov-form-label size="m" slot="label">filtr Hodnota A</gov-form-label>
                </gov-form-checkbox>
              </li>
              <li>
                <!-- OPRAVENO: Přidáno id="filter-b" -->
                <gov-form-checkbox id="filter-b" size="m" value="hodnota-b" name="filter1" class="js-filter-checkbox">
                  <gov-form-label size="m" slot="label">filtr Hodnota B</gov-form-label>
                </gov-form-checkbox>
              </li>
            </ul>
          </fieldset>

          <!-- Skupina 2: Filtr 2 -->
          <fieldset class="gov-filter-group">
            <legend class="gov-filters__heading">Filtr 2</legend>
            <ul class="gov-list--plain">
              <li>
                <!-- OPRAVENO: Přidáno id="filter-c" -->
                <gov-form-checkbox id="filter-c" size="m" value="hodnota-c" name="filter2" class="js-filter-checkbox">
                  <gov-form-label size="m" slot="label">filtr Hodnota C</gov-form-label>
                </gov-form-checkbox>
              </li>
              <li>
                <!-- OPRAVENO: Přidáno id="filter-d" -->
                <gov-form-checkbox id="filter-d" size="m" value="hodnota-d" name="filter2" class="js-filter-checkbox">
                  <gov-form-label size="m" slot="label">filtr Hodnota D</gov-form-label>
                </gov-form-checkbox>
              </li>
            </ul>
          </fieldset>

        </form>
      </aside>
    </gov-layout-column>

    <!-- Hlavní obsah s kartami -->
    <gov-layout-column>
      <main>
        <section aria-label="Výpis článků">
          <gov-grid gap="l" class="gov-card-grid">
            
            <!-- Karta A (Filtr A) -->
            <gov-grid-item col-span="12" data-category="hodnota-a" class="gov-card-item">
              <article>
                <gov-card direction="horizontal" href="#" aria-labelledby="akt-hodnota-a">
                  <gov-flex gap="s" direction="column">
                    <header>
                      <h2 id="akt-hodnota-a" class="gov-card__headline">Hodnota A</h2>
                    </header>
                  </gov-flex>
                </gov-card>
              </article>
            </gov-grid-item>

            <!-- Karta B (Filtr B) -->
            <gov-grid-item col-span="12" data-category="hodnota-b" class="gov-card-item">
              <article>
                <gov-card direction="horizontal" href="#" aria-labelledby="akt-hodnota-b">
                  <gov-flex gap="s" direction="column">
                    <header>
                      <h2 id="akt-hodnota-b" class="gov-card__headline">Hodnota B</h2>
                    </header>
                  </gov-flex>
                </gov-card>
              </article>
            </gov-grid-item>

            <!-- Karta C (Filtr C) -->
            <gov-grid-item col-span="12" data-category="hodnota-c" class="gov-card-item">
              <article>
                <gov-card direction="horizontal" href="#" aria-labelledby="akt-hodnota-c">
                  <gov-flex gap="s" direction="column">
                    <header>
                      <h2 id="akt-hodnota-c" class="gov-card__headline">Hodnota C</h2>
                    </header>
                  </gov-flex>
                </gov-card>
              </article>
            </gov-grid-item>

            <!-- Karta D (Filtr A i D) -->
            <gov-grid-item col-span="12" data-category="hodnota-a hodnota-d" class="gov-card-item">
              <article>
                <gov-card direction="horizontal" href="#" aria-labelledby="akt-hodnota-d">
                  <gov-flex gap="s" direction="column">
                    <header>
                      <h2 id="akt-hodnota-d" class="gov-card__headline">Hodnota D</h2>
                    </header>
                  </gov-flex>
                </gov-card>
              </article>
            </gov-grid-item>

          </gov-grid>
        </section>
      </main>
    </gov-layout-column>
  </gov-layout>
</gov-container>
